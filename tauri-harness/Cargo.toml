[package]
name = "tauri-plugin-macos-ui-mcp"
version = "0.1.0"
edition = "2021"
description = "DEBUG-only Tauri v2 plugin that exposes the app's webview UI to the macos-ui-mcp MCP server, using the same HTTP contract as the Swift/AppKit harness."
license = "MIT"
links = "tauri-plugin-macos-ui-mcp"

[dependencies]
tauri = "2"
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
